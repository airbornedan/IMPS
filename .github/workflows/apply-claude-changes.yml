steps:
      - name: Check secret is actually set
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::DEPLOY_TOKEN is empty or not visible to this job"
            exit 1
          else
            echo "DEPLOY_TOKEN is present, length ${#TOKEN}"
          fi
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
          fetch-depth: 0
