# Sample Apache vhost for serving IMPS via mod_wsgi.
#
# This assumes the install layout used throughout the README:
#   - IMPS files placed in /var/www
#   - Python dependencies installed into /var/www/.venv (README step 5-8)
#   - /var/www/adapter.wsgi present (ships with IMPS, no edits needed)
#
# If your install lives somewhere other than /var/www, update every
# path below to match -- and make sure it also matches imps_dir in
# imps_config.toml, since the app validates that path on startup.
#
# INSTALL:
#   sudo apt-get install libapache2-mod-wsgi-py3
#   sudo a2enmod wsgi
#   sudo cp imps-apache.conf /etc/apache2/sites-available/imps.conf
#   sudo a2ensite imps.conf
#   sudo a2dissite 000-default.conf   # only if something else is still
#                                      # bound to port 80 on this vhost
#
# PERMISSIONS (do this before starting Apache -- see README step 13):
# Apache's worker process runs as www-data, not the user who ran the
# install steps, so www-data needs read access to the app itself and
# write access to anything IMPS writes at runtime:
#   sudo chown -R www-data:www-data /var/www/static/images
#   sudo chown -R www-data:www-data /var/www/static/backup
#   sudo chown www-data:www-data /var/www/.secret_key
#   sudo chmod 600 /var/www/.secret_key
#
# The .secret_key file in particular is created root:root, mode 600,
# the first time IMPS runs (see app/extensions.py). If Apache can't
# read it, the app fails at startup with a permissions error there --
# this is the single most common deploy failure, so don't skip it.
#
# START:
#   sudo systemctl restart apache2
#
# VERIFY:
#   sudo apachectl configtest
#   curl -I http://localhost/

<VirtualHost *:80>
    ServerName imps.local
    # Replace imps.local with your server's actual hostname or IP if
    # you want to reach it by name from other devices on your network.

    WSGIDaemonProcess imps \
        python-home=/var/www/.venv \
        python-path=/var/www \
        processes=2 threads=4

    WSGIProcessGroup imps
    WSGIScriptAlias / /var/www/deploy/apache/adapter.wsgi process-group=imps application-group=%{GLOBAL}

    <Directory /var/www>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/imps_error.log
    CustomLog ${APACHE_LOG_DIR}/imps_access.log combined
</VirtualHost>
