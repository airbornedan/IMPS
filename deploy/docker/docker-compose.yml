services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: box_db
      MARIADB_USER: box_user
      MARIADB_PASSWORD: ${IMPS_DB_PASSWORD:?set IMPS_DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  imps:
    image: ghcr.io/airbornedan/imps:${IMPS_VERSION:-latest}
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${IMPS_PORT:-80}:80"
    environment:
      IMPS_IP: ${IMPS_IP:?set IMPS_IP in .env}
      IMPS_DB_PASSWORD: ${IMPS_DB_PASSWORD}
      IMPS_LABEL: ${IMPS_LABEL:-}
      IMPS_HTTPS: "0"
    volumes:
      - imps_data:/data
    restart: unless-stopped

volumes:
  db_data:
  imps_data:
