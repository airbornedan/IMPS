# Safer alternative to having the Flask app restart MySQL itself.
#
# This tells systemd to auto-restart the mysql/mariadb service if it
# crashes -- no application code, no sudoers changes, no risk of one
# app on a shared box taking down every other site's database
# connections. This is systemd doing exactly the job it's designed for.
#
# INSTALL:
#   sudo systemctl edit mysql
#     (or `mariadb`, whichever your system actually uses --
#      check with: systemctl status mysql mariadb)
#
# This opens an editor for a drop-in override file. Paste the [Service]
# block below, save, then:
#   sudo systemctl daemon-reload
#   sudo systemctl restart mysql
#
# VERIFY:
#   systemctl show mysql -p Restart -p RestartUSec
#   (should show Restart=on-failure)

[Service]
Restart=on-failure
RestartSec=5s

# Optional safety valve: stop trying after repeated rapid failures,
# rather than restart-looping forever if something is fundamentally
# broken (corrupted data dir, disk full, etc). This caps it at 5
# restarts within a 10 minute window before systemd gives up and
# leaves the service stopped -- at which point it needs a human to
# look at *why*, not another automatic restart.
StartLimitIntervalSec=600
StartLimitBurst=5
