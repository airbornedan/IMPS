<h1 class="help-heading">Editing a box</h1>
<hr>
<p>Use this page to choose which existing box you want to edit.</p>
<p>Enter or select a box number, then select the box button
(<img src="/static/images/icons/box_closed_icon.png" height="20" style="vertical-align:middle;">)
to continue to change its name or location. Box numbers themselves are
changed separately via <b>Renumber box</b>, not through this edit
form.</p>
