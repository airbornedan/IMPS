<span class="help-heading">Editing a box</span>
<hr>
<p>Use this page to choose which existing box you want to edit.</p>
<p>Enter or select a box number, then continue to change its name or
location. Box numbers themselves are changed separately via
<b>Renumber box</b>, not through this edit form.</p>
