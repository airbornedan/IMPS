<h1 class="help-heading">Editing a box</h1>
<hr>
<p>Use this page to choose which existing box you want to edit.</p>
<p>Enter or select a box number, then select
<span class="imps icon-left box_closed">Box</span> to continue to
change its name or location. Box numbers themselves are changed
separately via <b>Renumber box</b>, not through this edit form.</p>
