<span class="help-heading">List of boxes</span>
<hr>
<p>This page lists all boxes, optionally filtered to a single
location.</p>
<p>From here you can select <b>Add box</b> to create a new box, or
select an existing box to view its contents. If a location has no
boxes assigned to it, this page will say so and point you back to the
full box list.</p>
