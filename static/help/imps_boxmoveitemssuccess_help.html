<span class="help-heading">Items moved and box deleted</span>
<hr>
<p>This confirms that all items from the deleted box were moved to the
box you chose, and the original (now-empty) box has been removed.</p>
<p class="note">Select the destination box's button to go straight to
its contents and confirm the items arrived.</p>
