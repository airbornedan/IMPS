<h1 class="help-heading">Items moved and box deleted</h1>
<hr>
<p>This confirms that all items from the deleted box were moved to the
box you chose, and the original (now-empty) box has been removed.</p>
<p class="note">Select the destination box's button
(<img src="/static/images/icons/list_icon.png" height="20" style="vertical-align:middle;">)
to go straight to its contents and confirm the items arrived.</p>
