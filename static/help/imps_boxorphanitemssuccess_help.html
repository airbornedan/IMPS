<span class="help-heading">Box deleted, items orphaned</span>
<hr>
<p>This confirms the box has been deleted. Any items that were in it
were not deleted &mdash; they're still in IMPS, but no longer assigned
to a box.</p>
<p class="note">To find and reassign these items, use the
<a href="/cp_orphaneditemscleanup" target="_top">Orphaned Items tool</a> in the
Control Panel.</p>
