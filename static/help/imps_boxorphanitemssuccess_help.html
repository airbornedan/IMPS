<h1 class="help-heading">Box deleted, items orphaned</h1>
<hr>
<p>This confirms the box has been deleted. Any items that were in it
were not deleted &mdash; they're still in IMPS, but no longer assigned
to a box.</p>
<p class="note">To find and reassign these items, use the
<a href="/cp_orphaneditemscleanup" target="_top">Orphaned Items tool</a>
(<img src="/static/images/icons/orphans_icon.png" height="20" style="vertical-align:middle;">)
in the Control Panel.</p>
