<span class="help-heading">Box contents</span>
<hr>
<p>This page shows every item currently assigned to one box, along
with the box's name and location if set.</p>
<p>From here you can add a new item directly into this box, or select
an existing item to view, edit, or delete it. This is also the page
that a printed box label's QR code links to.</p>
