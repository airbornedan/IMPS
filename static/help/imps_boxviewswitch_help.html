<h1 class="help-heading">Box contents view</h1>
<hr>
<p>This toggles a box's contents list between the
<img src="/static/images/icons/desktop_icon.png" class="help-icon"> desktop table layout
and a <img src="/static/images/icons/mobile_icon.png" class="help-icon"> mobile-friendly card layout.
It shows the same items either way &mdash; use whichever view is
easier to read on your current device.</p>
