<h1 class="help-heading">Box contents view</h1>
<hr>
<p>This toggles a box's contents list between the desktop table layout
(<img src="/static/images/icons/desktop_icon.png" height="20" style="vertical-align:middle;">)
and a mobile-friendly card layout
(<img src="/static/images/icons/mobile_icon.png" height="20" style="vertical-align:middle;">).
It shows the same items either way &mdash; use whichever view is
easier to read on your current device.</p>
