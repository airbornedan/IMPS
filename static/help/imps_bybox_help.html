<h1 class="help-heading">Find a box by number</h1>
<hr>
<p>Enter a box number here to jump directly to that box's contents.
As you type, IMPS suggests matching existing box numbers.</p>
<p>This is a quick way to look up a box's contents when you already
know its number, e.g. from a printed label.</p>
