<h1 class="help-heading">Restore from backup</h1>
<hr>
<p>Select <span class="imps icon-left restore">Restore</span> to
replace your current database and photos with the backup's.</p>
<p class="note">If a restore fails partway through, your original
data is automatically put back and nothing is lost.</p>
