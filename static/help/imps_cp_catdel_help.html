<h1 class="help-heading">Deleting a category</h1>
<hr>
<p>This is a confirmation page for deleting a category. Select
<b>Delete</b>
(<img src="/static/images/icons/trash_icon.png" height="20" style="vertical-align:middle;">)
to confirm.</p>
<p>Deleting a category does not delete any items. Items that were
assigned to the deleted category are automatically moved to
<i>Uncategorized</i>.</p>
