<h1 class="help-heading">Editing a category</h1>
<hr>
<p>Use this page to rename an existing category, then select
<span class="imps icon-left update">Update</span> to save.</p>
<p>Every item currently assigned to this category will show the updated
name once saved &mdash; you don't need to edit items individually.</p>
