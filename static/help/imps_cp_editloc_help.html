<h1 class="help-heading">Editing a location</h1>
<hr>
<p>Use this page to rename an existing location, then select
<span class="imps icon-left update">Update</span> to save.</p>
<p>Every box currently assigned to this location will show the updated
name once saved &mdash; you don't need to edit boxes individually.</p>
