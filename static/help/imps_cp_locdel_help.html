<h1 class="help-heading">Deleting a location</h1>
<hr>
<p>This is a confirmation page for deleting a location. Select
<b>Delete</b>
(<img src="/static/images/icons/trash_icon.png" height="20" style="vertical-align:middle;">)
to confirm.</p>
<p>Deleting a location does not delete any boxes. Boxes that were
assigned to the deleted location are automatically moved to
<i>Unspecified</i>.</p>
