<h1 class="help-heading">Changing the password</h1>
<hr>
<p>Use this page to change the shared IMPS login password.</p>
<p>Enter the new password and confirm it, then select Update
(<img src="/static/images/icons/update_icon.png" height="20" style="vertical-align:middle;">)
to save. You will need to
use the new password the next time you (or anyone else) logs in.</p>
