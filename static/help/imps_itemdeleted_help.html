<h1 class="help-heading">Item deleted</h1>
<hr>
<p>This confirms the item has been permanently deleted, along with its
photo file if it had one.</p>
<p class="note">Use <span class="imps icon-left home">Back</span>
to return to the list you deleted it from, or
<span class="imps icon-left home">Home</span>
to go to the main menu.</p>
