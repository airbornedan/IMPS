<h1 class="help-heading">Item details</h1>
<hr>
<p>This page shows the full details of a single item: its name, box
number, date added, category, description, and photo (if any).</p>
<p>From here you can edit the item
(<img src="/static/images/icons/edit_icon.png" height="20" style="vertical-align:middle;">),
delete it
(<img src="/static/images/icons/trash_icon.png" height="20" style="vertical-align:middle;">),
or navigate back
(<img src="/static/images/icons/home_icon.png" height="20" style="vertical-align:middle;">)
to wherever you came from (its box, a category view, or search
results).</p>
