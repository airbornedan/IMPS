<h1 class="help-heading">Editing an item</h1>
<hr>
<p>Use this page to change an existing item's name, category, box
number, description, or photo.</p>
<p>Moving an item to a different box number just requires entering the
new (valid) box number and selecting
<span class="imps icon-left update">Update</span> &mdash; the item's
history and description are preserved.</p>
