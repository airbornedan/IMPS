<span class="help-heading">Items in a category</span>
<hr>
<p>This page lists every item assigned to one category, reached by
selecting that category on the <b>By category</b> page.</p>
<p>Use the pagination controls if the category has more items than fit
on one page. Select an item to view its full details.</p>
