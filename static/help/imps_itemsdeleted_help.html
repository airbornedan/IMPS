<h1 class="help-heading">Items deleted</h1>
<hr>
<p>This confirms the items have been permanently deleted, along with
their photo files where they had one.</p>
<p class="note">Use <span class="imps icon-left home">Back</span>
to return to the list you deleted them from, or
<span class="imps icon-left home">Home</span>
to go to the main menu.</p>
