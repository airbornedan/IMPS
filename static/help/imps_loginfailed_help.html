<h1 class="help-heading">Login failed</h1>
<hr>
<p>The password entered on the login screen was incorrect.</p>
<p>Select
<a href="/login" target="_top"><b>Login</b></a>
(<img src="/static/images/icons/login_icon.png" height="20" style="vertical-align:middle;">)
to try again.</p>
<p class="note">If you do not remember your IMPS password, it can be
verified or reset in the IMPS configuration file on the server.</p>
