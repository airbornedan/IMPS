<h1 class="help-heading">Logged out</h1>
<hr>
<p>You have been logged out of IMPS. Your session no longer has access
to the inventory until you log back in.</p>
<p>Select
<a href="/login" target="_top"><span class="imps icon-left login">Log in</span></a>
to return to the login screen.</p>
