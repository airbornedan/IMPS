<h1 class="help-heading">Orphaned items view</h1>
<hr>
<p>This toggles the orphaned items list between the
<img src="/static/images/icons/desktop_icon.png" height="20" style="vertical-align:middle;"> desktop table layout
and a <img src="/static/images/icons/mobile_icon.png" height="20" style="vertical-align:middle;"> mobile-friendly card layout.
It shows the same information either way &mdash; use whichever view is
easier to read on your current device.</p>
