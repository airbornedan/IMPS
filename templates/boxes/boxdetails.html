{% extends "base.html" %}
{% block content %}
<div class="container-flex">
	<div class="row">
		<p class="page_title">Edit box {{box_num}}</p>
	</div>
	<div class="row">
		<p><a href="/boxrenumber/{{box_num}}"><button type="button" class="imps icon-left edit">Change #</button></a></p>
	</div>

	<form name="update_box" action="/boxedited" method="POST">
	<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
	<input type="hidden" name="box_num" id="box_num" value="{{box_num}}">

	<div>
		<div>
			<div class="row">
				Location:
			</div>
			<div>
				<input list="box_loc" name="box_loc" placeholder="{{box_loc}}" autocomplete="off">
				<datalist id="box_loc">
					{% for loc_name , loc_num in locations %}
						<option value="{{loc_name}}">{{loc_name}}</option>
					{% endfor %}
				</datalist>
			</div>
		</div>
		<div>
			<div>
				Box name
			</div>
			<div>
				<input type="text" id="box_name" name="box_name" size="25" value="{{- box_desc -}}">
			</div>
		</div>
	</div>

	<div>
		<div class="btn-pair">
			<div>
				<button type="submit" id="submit_button" class="imps icon-left update">
					Update
				</button>
			</div>
			<div>
				<a href="boxshowcontent/{{box_num}}">
					<button class="imps icon-left list">Show contents</button>
				</a>
			</div>
		</div>
	</div>
	</form>
</div>
{% endblock %}
